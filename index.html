<!DOCTYPE html>
<html lang="pt-PT"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Comenda de Braga · Calendário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* App real · Layout: sticky header with role switcher, single content column (max 1100px), month grid + agenda list, slide-in demo inbox, modal forms */
:root{
  --bg:#f5f4f4; --surface:#ffffff; --surface-2:#faf8f8; --ink:#1d1a1b; --muted:#6a6264; --line:#e3dcdd;
  --red:#b0001e; --red-soft:#f8e5e8; --on-red:#ffffff; --gold:#8a6a1f; --gold-soft:#f6efdc;
  --ok:#2d7a4c; --ok-soft:#e5f2ea; --warn:#a86300; --warn-soft:#fbf0de; --shadow:0 10px 30px rgba(40,10,12,.12);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131112; --surface:#1d1a1b; --surface-2:#242021; --ink:#f2eded; --muted:#a99fa1; --line:#352f30;
  --red:#e8505e; --red-soft:#3a1a1f; --on-red:#1a0a0b; --gold:#d4b25c; --gold-soft:#342b17;
  --ok:#5bb581; --ok-soft:#18301f; --warn:#e3a34a; --warn-soft:#352812; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131112; --surface:#1d1a1b; --surface-2:#242021; --ink:#f2eded; --muted:#a99fa1; --line:#352f30;
  --red:#e8505e; --red-soft:#3a1a1f; --on-red:#1a0a0b; --gold:#d4b25c; --gold-soft:#342b17;
  --ok:#5bb581; --ok-soft:#18301f; --warn:#e3a34a; --warn-soft:#352812; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .seal{flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.welcome{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-bottom:24px}
.welcome .arms{background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line);width:120px}
.welcome h1{font-size:clamp(1.4rem,3vw,2rem);color:var(--red)}
.welcome p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.welcome .motto{font-family:var(--f-display);font-size:.8rem;letter-spacing:.12em;color:var(--gold);margin-top:8px;text-transform:uppercase}
@media (max-width:520px){.welcome{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.welcome .arms{width:110px}}
.mh .seal-s{width:34px;height:34px;border-radius:50%;background:#fff;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.inboxbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.inboxbtn .n{background:var(--red);color:var(--on-red);border-radius:99px;font-size:.72rem;padding:0 6px;min-width:18px;text-align:center}
.banner{background:var(--gold-soft);color:var(--ink);font-size:.88rem;border-bottom:1px solid var(--line)}
.banner .wrap{padding-block:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--gold);font-weight:600;padding:0}
main{padding-block:24px 60px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:1.15rem;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.pill.pub{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.pill.mem{background:var(--gold-soft);color:var(--gold)}
.pill.dir{background:var(--ink);color:var(--surface)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.cx{background:var(--red-soft);color:var(--red)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{margin:0 auto 0 0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .num{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 5px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--red);color:var(--on-red)}
.chip.mem{background:var(--gold);color:var(--surface)}
.chip.dir{background:var(--ink);color:var(--surface)}
.calopts{display:grid;gap:8px}.calopts .btn{justify-content:flex-start;text-align:left}
.chip.draft{opacity:.55;outline:1px dashed var(--muted)}
.chip.cx{background:var(--line);color:var(--muted);text-decoration:line-through}
@media (max-width:560px){.cal .d{min-height:52px}.chip{font-size:0;height:8px;padding:0}}
/* event cards */
.ev{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.datebox{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;background:var(--surface-2);align-self:start}
.datebox b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.datebox span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--red);font-weight:700}
.ev h3{font-family:var(--f-body);font-weight:700;font-size:1.02rem;letter-spacing:0}
.ev .meta{color:var(--muted);font-size:.88rem}
.ev .row{margin-top:6px}
.ev.cancel h3{text-decoration:line-through;color:var(--muted)}
/* forms */
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--red);width:18px;height:18px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;font-size:.9rem;padding:0 4px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.f2{grid-template-columns:minmax(0,1fr)}}
/* tabs & tables */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--surface)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody td:first-child{white-space:nowrap}
td.notecell{min-width:180px;max-width:280px;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pill.ext{background:transparent;border-color:var(--gold);color:var(--gold)}
form .ext-only{display:none}form.ext .ext-only{display:flex}form.ext .reg-only{display:none!important}
.tile.hi{border-color:var(--red);background:var(--red-soft)}
.tile b small{font-size:.9rem;color:var(--muted)}
tr.grp td{background:var(--surface-2);font-weight:700;font-family:var(--f-display);letter-spacing:.03em}
.guest{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.guest .gh{display:flex;justify-content:space-between;align-items:center}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.tile b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,5,6,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer .bd{overflow:auto;flex:1}
.mail{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer}
.mail:hover{background:var(--surface-2)}
.mail.unread b{color:var(--red)}
.mail .s{font-weight:600;display:block}
.mailview{padding:16px;display:flex;flex-direction:column;gap:12px}
.mailcard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mailcard .mh{background:var(--red);color:var(--on-red);padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600}
.mailcard .mb{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:.95rem}
.mailcard .mf{padding:10px 14px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;position:relative}
.modal .x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}

.narrow{max-width:520px;margin:30px auto}
.armsmall{width:110px;background:#fff;border-radius:10px;padding:6px;margin:0 auto;display:block}
.lnk{color:var(--red)}
.pw{position:relative;display:flex}.pw input{padding-right:88px}
.pwt{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--red);font:inherit;font-weight:600;font-size:.85rem;padding:6px 10px;cursor:pointer;border-radius:6px}
.pwt:hover{background:var(--red-soft)}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}.mtools label{flex:1;min-width:200px}
.errlist{max-height:220px;overflow:auto;margin:0;padding-left:20px;font-size:.88rem}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}.langsw button{border:0;background:transparent;padding:5px 10px;font:inherit;font-weight:700;font-size:.78rem;letter-spacing:.04em;cursor:pointer;color:var(--muted)}.langsw button[aria-pressed=true]{background:var(--red);color:var(--on-red)}
#hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.primary{color:var(--on-red)}
td.nw{white-space:nowrap}
body.busy{cursor:progress}
body.busy .btn{opacity:.6;pointer-events:none}
.ok-note{border-color:var(--ok);background:var(--ok-soft)}
#hdr-right{display:flex;align-items:center;gap:10px}
footer.foot{padding-block:0 30px;color:var(--muted);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){.hide-s{display:none}}
</style></head><body>

let toastT;
function toast(m){const l=document.getElementById('toast');if(l)l.remove();const t=document.createElement('div');t.className='toast';t.id='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),4500)}
async function act(fn,...args){if(ui.busy)return null;ui.busy=true;document.body.classList.add('busy');try{return await call(fn,...args)}catch(e){toast(errMsg(e));if(String(e.message||'').indexOf('SESSAO')>=0){A=null;B.admin='';sSet('');render()}return null}finally{ui.busy=false;document.body.classList.remove('busy')}}

/* ---------- carregar ---------- */
async function loadPublic(){try{D=await call('apiDados',B.token||'')}catch(e){D={org:B.org,hoje:iso(new Date()),eventos:[],me:null};toast(errMsg(e))}
  if(!ui.month)ui.month=D.hoje.slice(0,7);
  if(D.me&&B.token){lsS(TK,B.token);if(D.me.lingua&&!lsG(LK)&&!Q.get('lang'))LANG=D.me.lingua;else if(D.me.lingua!==LANG)call('apiLingua',B.token,LANG).catch(()=>{})}
  if(B.token&&!D.me&&ui.mode!=='sair'){if(B.token===lsG(TK))lsS(TK,'');B.token=''}
}
async function loadAdmin(){try{A=await call('apiAdminDados',B.admin)}catch(e){A=null;B.admin='';sSet('');if(!/SESSAO/.test(String(e.message)))toast(errMsg(e));else ui.msg='A sua sessão terminou. Entre de novo com o seu email e palavra-passe.'}
  if(A&&!ui.month)ui.month=A.hoje.slice(0,7);
}
async function boot(){
  document.getElementById('orgname').textContent=B.org;
  if(B.confirmar){try{const r=await call('apiConfirmar',B.confirmar);B.flash=r.msg;if(r.ok)B.token=B.confirmar}catch(e){B.flash=errMsg(e)}try{history.replaceState(null,'',B.url+(B.token?'?t='+encodeURIComponent(B.token):''))}catch(e){}}
  if(B.insc){try{const r=await call('apiConfirmarInscricao',B.insc);B.flash=r.msg;B.inscOk=r.ok;if(r.token){B.token=r.token;lsS(TK,r.token)}if(r.ev)B.ev=r.ev}catch(e){B.flash=errMsg(e)}try{history.replaceState(null,'',B.url+(B.token?'?t='+encodeURIComponent(B.token):''))}catch(e){}}
  if(!B.token&&!ui.mode)B.token=lsG(TK);
  if(ui.mode==='admin'){B.admin=sGet();if(B.admin)await loadAdmin()}
  else await loadPublic();
  render();
  if(B.flash)toast(B.flash);
  if(B.cal&&D&&D.me&&ui.mode!=='admin'&&!B.ev){ui.modal={type:'cal'};renderLayer()}
  if(B.ev&&D&&ui.mode!=='admin'){let e=D.eventos.find(x=>x.id===B.ev);
    let viaLink=false;
    if(!e){try{const le=await call('apiEventoLink',B.ev);if(le){ui.linkEv=le;e=le;viaLink=true}}catch(err){}}
    if(e){const open=e.estado==='ativo'&&!e.externo&&TODAY()<=e.prazo;ui.modal=B.inscOk||!open?{type:'event',id:e.id}:(D.me&&!viaLink)?{type:'reg',id:e.id}:{type:'regpub',id:e.id};renderLayer()}
    else if(!B.flash)toast(L('Este evento não está disponível.','This event is not available.'))}
}

/* ---------- helpers de dados ---------- */
const evs=()=>ui.mode==='admin'?(A?A.eventos:[]):(D?D.eventos:[]);
const ev=id=>evs().find(e=>e.id===id)||(ui.linkEv&&ui.linkEv.id===id?ui.linkEv:null);
const myReg=id=>D&&D.me&&D.me.inscricoes.find(r=>r.evento_id===id);
function peopleOf(eid){
  const out=[];const subs=A.inscritos;
  A.inscricoes.filter(r=>r.evento_id===eid).forEach(r=>{const s=subs.find(x=>x.email===r.email);const m=s&&s.membro;
    out.push({group:m?'mem':'non',type:m?'Membro':'Inscrito não membro',n_ordem:(s&&s.n_ordem)||'',nome:r.nome,email:r.email,telemovel:r.telemovel,agape:r.agape,visita:!!r.visita,nif:r.nif||'',restricoes:r.restricoes,atividades:r.atividades||[],nota:[r.observacoes,r.motivo?'Alterou: '+r.motivo:''].filter(Boolean).join(' · ')});
    (r.convidados||[]).forEach(g=>out.push({group:'gst',type:'Convidado',n_ordem:'',nome:g.nome,email:g.email,telemovel:g.telemovel,agape:g.agape,visita:!!g.visita,nif:'',restricoes:g.restricoes,atividades:g.atividades||[],nota:'Convidado de '+r.nome}));
  });return out;
}
const countPeople=eid=>A.inscricoes.filter(r=>r.evento_id===eid).reduce((a,r)=>a+1+(r.convidados||[]).length,0);

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const hr=document.getElementById('hdr-right');applyStatic();
  if(ui.mode==='definir'){
    hr.innerHTML='';app.innerHTML=viewDefinir();
  } else if(ui.mode==='admin'){
    hr.innerHTML=A?'<span class="small muted hide-s">'+esc(A.quem)+'</span><a class="btn sm" href="'+esc(B.url)+'" target="_top">Ver calendário</a><button class="btn sm" data-act="logout">Sair</button>':'';
    app.innerHTML=A?viewAdmin():adminLogin();
  } else if(ui.mode==='sair'){
    hr.innerHTML=langSw();app.innerHTML=viewSair();
  } else {
    hr.innerHTML=(D&&D.me?'<span class="small">'+L('Olá, ','Hello, ')+'<b>'+esc(D.me.nome.split(' ')[0])+'</b></span>':'')+langSw();
    app.innerHTML=viewCalendarPage();
  }
  renderLayer();
}
function viewSair(){
  if(ui.msg)return '<section class="panel narrow"><h2>'+L('Notificações','Notifications')+'</h2><p>'+esc(ui.msg)+'</p><a class="btn" href="'+esc(B.url)+'" target="_top">'+L('Voltar ao calendário','Back to the calendar')+'</a></section>';
  return '<section class="panel narrow stack"><h2>'+L('Deixar de receber notificações','Unsubscribe from notifications')+'</h2><p style="margin:0">'+L('Deixa de receber os convites e lembretes dos eventos','You will stop receiving event invitations and reminders')+(D&&D.me?L(' em ',' at ')+'<b>'+esc(D.me.email)+'</b>':'')+'. '+L('Pode voltar a inscrever-se quando quiser.','You can subscribe again at any time.')+'</p><div class="row"><button class="btn danger" data-act="sair">'+L('Deixar de receber','Unsubscribe')+'</button><a class="btn" href="'+esc(B.url)+'" target="_top">'+L('Cancelar','Cancel')+'</a></div></section>';
}
function viewCalendarPage(){
  const side=D.me?meBox():subscribeBox();
  return (D.me?'':welcome())+'<div class="grid2"><div class="stack">'+calendar()+'</div><div class="stack">'+side+agenda()+'</div></div>';
}
function welcome(){return '<section class="welcome"><img class="arms" src="'+ARMS+'" alt="'+L('Brasão da Ordem','Coat of arms of the Order')+'"><div><h1>'+esc(D.org)+'</h1><p>'+L('Calendário de eventos da Comenda. Consulte os próximos encontros e peça para receber os convites e formulários de inscrição por email.','Event calendar of the Comenda. See our upcoming gatherings and ask to receive invitations and registration forms by email.')+'</p><div class="motto">Non nobis Domine, non nobis, sed nomini tuo da gloriam</div></div></section>'}
function subscribeBox(){
  return '<section class="panel"><h2>'+L('Receber notificações','Get notifications')+'</h2><p class="muted small" style="margin:0 0 12px">'+L('Indique os seus dados para receber os convites e formulários dos eventos. Vai receber um email para confirmar.','Enter your details to receive event invitations and forms. You will receive an email to confirm.')+'</p>'+
  '<form data-form="subscribe" class="stack"><label>Email<input type="email" id="sub-email" required autocomplete="email" placeholder="'+L('nome@exemplo.pt','name@example.com')+'"></label><label>'+L('Nome completo','Full name')+'<input type="text" id="sub-name" required autocomplete="name" placeholder="'+L('Ex.: João Silva','E.g. John Smith')+'"></label><div class="f2"><label>'+L('Contacto','Phone')+'<input type="tel" id="sub-phone" required autocomplete="tel" placeholder="'+L('Ex.: 912 345 678','E.g. +351 912 345 678')+'"></label><label>'+L('Localidade','Town / city')+'<input type="text" id="sub-city" required autocomplete="address-level2" placeholder="'+L('Ex.: Braga','E.g. Braga')+'"></label></div><label>'+L('Nº da Ordem (opcional, se for membro)','Order number (optional, if you are a member)')+'<input type="text" id="sub-num" autocomplete="off" placeholder="'+L('Ex.: 1234','E.g. 1234')+'"></label><label>'+L('Nota ou comentário (opcional)','Note or comment (optional)')+'<textarea id="sub-note" placeholder="'+L('Algo que queira dizer à Comenda','Anything you would like to tell the Comenda')+'"></textarea></label><button class="btn primary">'+L('Pedir inscrição','Subscribe')+'</button></form></section>';
}
function meBox(){const me=D.me;
  return '<section class="panel"><h2>'+esc(me.nome)+'</h2><p class="small" style="margin:0">'+(me.membro?'<span class="pill mem">'+L('Membro','Member')+(me.n_ordem?L(' nº ',' no. ')+esc(me.n_ordem):'')+'</span>'+(me.direcao?' <span class="pill dir">'+L('Direção','Board')+'</span>':'')+' '+L('Vê também os eventos reservados a membros.','You also see members-only events.'):'<span class="pill pub">'+L('Inscrito','Subscribed')+'</span> '+L('Vê os eventos públicos da Comenda.','You see the Comenda\'s public events.'))+'</p>'+
  '<p class="small muted" style="margin:8px 0 0">'+esc(me.email)+' · '+L('inscrito em '+me.inscricoes.length+' evento(s)','registered for '+me.inscricoes.length+' event(s)')+'</p><p class="small" style="margin:8px 0 0"><a href="#" data-act="cal" class="lnk"><b>📅 '+L('Adicionar os meus eventos ao calendário do telemóvel','Add my events to my phone calendar')+'</b></a></p><p class="small" style="margin:8px 0 0"><a href="'+esc(B.url)+'?sair='+encodeURIComponent(B.token)+'" target="_top" class="lnk">'+L('Deixar de receber notificações','Unsubscribe from notifications')+'</a> · <a href="#" data-act="forget" class="lnk">'+L('Não é '+esc(me.nome.split(' ')[0])+'? Sair','Not '+esc(me.nome.split(' ')[0])+'? Sign out')+'</a></p></section>';
}
function calendar(){
  const [y,m]=ui.month.split('-').map(Number);
  const first=new Date(y,m-1,1,12);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const list=evs();let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);
    if(i===35&&d.getMonth()!==m-1)break;
    const de=sorted(list.filter(e=>e.data===ds));
    cells+='<div class="d'+(d.getMonth()!==m-1?' out':'')+(ds===TODAY()?' today':'')+'"><span class="num">'+d.getDate()+'</span>'+
      de.map(e=>'<button class="chip'+(e.estado==='rascunho'||e.estado==='oculto'?' draft':'')+(e.estado==='cancelado'?' cx':e.visibilidade==='direcao'?' dir':e.visibilidade==='membros'?' mem':'')+'" data-act="open-ev" data-id="'+e.id+'" title="'+esc(tE(e))+'">'+esc(e.hora+' '+tE(e))+'</button>').join('')+'</div>';
  }
  return '<section class="panel"><div class="calhead"><h2>'+mesN(m-1)+' '+y+'</h2><button class="btn sm" data-act="month" data-v="-1" aria-label="'+L('Mês anterior','Previous month')+'">‹</button><button class="btn sm" data-act="month" data-v="0">'+L('Hoje','Today')+'</button><button class="btn sm" data-act="month" data-v="1" aria-label="'+L('Mês seguinte','Next month')+'">›</button></div>'+
  '<div class="cal">'+(EN()?WD_EN:WD).map(w=>'<div class="wd">'+w+'</div>').join('')+cells+'</div>'+
  '<div class="row small muted" style="margin-top:10px"><span class="pill" style="background:var(--red);color:var(--on-red)">'+L('Público','Public')+'</span><span class="pill" style="background:var(--gold);color:var(--surface)">'+L('Membros','Members')+'</span>'+((ui.mode==='admin'||(D&&D.me&&D.me.direcao))?'<span class="pill dir">'+L('Direção / Gestão','Board')+'</span>':'')+'</div></section>';
}
function agenda(){
  const up=sorted(evs().filter(e=>e.data>=TODAY()));
  return '<section class="panel"><h2>'+L('Próximos eventos','Upcoming events')+'</h2>'+(up.length?up.map(e=>evCard(e)).join(''):'<div class="empty">'+L('Ainda não há eventos marcados.','No events scheduled yet.')+'</div>')+'</section>';
}
function badges(e){
  let b=e.visibilidade==='direcao'?'<span class="pill dir">'+L('Direção / Gestão','Board')+'</span>':e.visibilidade==='membros'?'<span class="pill mem">'+L('Membros','Members')+'</span>':'<span class="pill pub">'+L('Público','Public')+'</span>';
  if(e.externo)b+=' <span class="pill ext">'+L('Outra comenda: ','Other commandery: ')+esc(e.externo)+'</span>';
  if(e.estado==='cancelado')b+=' <span class="pill cx">'+L('Cancelado','Cancelled')+'</span>';
  if(e.estado==='rascunho')b+=' <span class="pill warn">Rascunho · não publicado</span>';
  if(e.estado==='oculto')b+=' <span class="pill warn">Oculto</span>';
  if(ui.mode==='admin'&&e.album)b+=' <span class="pill pub">📷 Álbum</span>';
  if(ui.mode==='admin'&&e.pasta_url)b+=' <a class="pill pub" href="'+esc(e.pasta_url)+'" target="_blank" rel="noopener" title="Abrir a pasta de fotos no Google Drive">📁 Pasta de fotos ↗</a>';
  if(ui.mode==='admin'&&e.agradecimento)b+=' <span class="pill ok">Agradecimento enviado</span>';
  if(ui.mode!=='admin'&&myReg(e.id))b+=' <span class="pill ok">'+L('Inscrito','Registered')+'</span>';
  return b;
}
function evCard(e,admin){
  const d=parse(e.data);
  let actions='<button class="btn sm" data-act="open-ev" data-id="'+e.id+'">'+L('Ver','View')+'</button>';
  if(!admin&&D&&e.estado!=='cancelado'&&!e.externo&&TODAY()<=e.prazo) actions+='<button class="btn sm primary" data-act="'+(D.me?'open-reg':'open-regpub')+'" data-id="'+e.id+'">'+(myReg(e.id)?L('Editar inscrição','Edit registration'):L('Inscrever-me','Register'))+'</button>';
  if(admin){
    const np=countPeople(e.id);
    const del=ui.pending==='del-'+e.id?'<button class="btn sm danger" data-act="del-ev" data-id="'+e.id+'">Confirmar eliminação'+(np&&e.data>=TODAY()&&e.estado!=='rascunho'&&e.estado!=='cancelado'?' (avisa '+np+' pessoa(s))':'')+'</button><button class="btn sm" data-act="pending-clear">Não</button>':'<button class="btn sm danger" data-act="ask-del" data-id="'+e.id+'">Eliminar</button>';
    if(e.estado==='rascunho') actions='<button class="btn sm" data-act="edit-ev" data-id="'+e.id+'">Editar</button><button class="btn sm primary" data-act="pub-ev" data-id="'+e.id+'">Publicar e enviar convites</button>'+del;
    else if(e.estado==='oculto') actions='<button class="btn sm" data-act="edit-ev" data-id="'+e.id+'">Editar</button><button class="btn sm primary" data-act="pub-ev" data-id="'+e.id+'">Mostrar</button><button class="btn sm" data-act="regs" data-id="'+e.id+'">Inscrições ('+np+' pessoas)</button>'+del;
    else actions='<button class="btn sm" data-act="edit-ev" data-id="'+e.id+'">Editar</button><button class="btn sm" data-act="copy-link" data-id="'+e.id+'">Copiar link</button>'+(e.externo?'':'<button class="btn sm" data-act="regs" data-id="'+e.id+'">Inscrições ('+np+' pessoas)</button>');
    if(e.estado==='ativo'){
      actions+='<button class="btn sm" data-act="notice" data-id="'+e.id+'">Enviar novidade</button>'+(e.externo?'':'<button class="btn sm" data-act="remind" data-id="'+e.id+'" data-v="7">Lembrete agora</button>');
      actions+=ui.pending==='cx-'+e.id?'<button class="btn sm danger" data-act="cancel-ev" data-id="'+e.id+'">Confirmar cancelamento</button><button class="btn sm" data-act="pending-clear">Não</button>':'<button class="btn sm danger" data-act="ask-cancel" data-id="'+e.id+'">Cancelar evento</button>';
      actions+='<button class="btn sm" data-act="hide-ev" data-id="'+e.id+'">Ocultar</button>'+del;
    }
    if(e.estado==='cancelado') actions+=del;
  }
  return '<article class="ev'+(e.estado==='cancelado'?' cancel':'')+'"><div class="datebox"><b>'+d.getDate()+'</b><span>'+mesN(d.getMonth()).slice(0,3)+'</span></div><div style="min-width:0"><div class="row" style="margin:0 0 2px">'+badges(e)+'</div><h3>'+esc(tE(e))+'</h3><div class="meta">'+esc(e.hora+' · '+e.local)+'</div><div class="row">'+actions+'</div></div></article>';
}

/* ---------- admin ---------- */
function adminLogin(){
  const head='<section class="panel narrow stack"><img src="'+ARMS+'" alt="Brasão da Ordem" class="armsmall"><h2>Área do administrador</h2>'+(ui.msg?'<div class="note">'+esc(ui.msg)+'</div>':'');
  if(ui.forgot) return head+'<p class="muted small" style="margin:0">Escreva o seu email de administrador. Vai receber um link para criar ou alterar a palavra-passe, válido durante 2 horas.</p><form data-form="admin-forgot" class="stack"><label>Email<input type="email" id="adm-email" required autocomplete="email"></label><button class="btn primary">Enviar link</button></form><p class="small" style="margin:0"><a href="#" class="lnk" data-act="forgot" data-v="0">Voltar à entrada</a></p></section>';
  return head+'<form data-form="admin-login" class="stack"><label>Email<input type="email" id="adm-email" required autocomplete="username"></label>'+pwField('adm-pw','Palavra-passe','current-password')+'<button class="btn primary">Entrar</button></form><p class="small" style="margin:0"><a href="#" class="lnk" data-act="forgot" data-v="1">Primeira vez ou esqueceu-se da palavra-passe?</a></p><p class="small muted" style="margin:0">A sessão termina quando fechar o browser.</p></section>';
}
function viewDefinir(){
  if(ui.msg)return '<section class="panel narrow stack"><h2>Palavra-passe</h2><div class="note">'+esc(ui.msg)+'</div><a class="btn" href="'+esc(B.url)+'?v=admin" target="_top">Ir para a área do administrador</a></section>';
  return '<section class="panel narrow stack"><img src="'+ARMS+'" alt="Brasão da Ordem" class="armsmall"><h2>Definir palavra-passe</h2><p class="muted small" style="margin:0">Escolha uma palavra-passe com pelo menos 8 caracteres. Só o senhor a fica a saber.</p><form data-form="definir" class="stack">'+pwField('pw1','Nova palavra-passe','new-password')+pwField('pw2','Repetir a palavra-passe','new-password')+'<button class="btn primary">Guardar e entrar</button></form></section>';

function viewAdmin(){
  const tabs=[['eventos','Eventos'],['inscritos','Inscritos'],['membros','Membros'],['inscricoes','Inscrições'],['definicoes','Definições']];
  let h='<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(ui.tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(A.fila.pendentes||A.fila.erros)h+='<div class="note" style="margin-bottom:14px">Emails em fila: <b>'+A.fila.pendentes+'</b>'+(A.fila.erros?' · com erro: <b>'+A.fila.erros+'</b>':'')+'. Envios disponíveis hoje: '+A.fila.quota+'. O que exceder o limite diário segue automaticamente no dia seguinte.</div>';
  if(ui.tab==='eventos') h+=adminEvents();
  if(ui.tab==='inscritos') h+=adminSubs();
  if(ui.tab==='membros') h+=adminMembers();
  if(ui.tab==='inscricoes') h+=adminRegs();
  if(ui.tab==='definicoes') h+=adminSettings();
  return h;
}
function adminEvents(){
  const up=sorted(A.eventos.filter(e=>e.data>=A.hoje)), past=sorted(A.eventos.filter(e=>e.data<A.hoje)).reverse();
  return '<div class="grid2"><section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Eventos</h2><button class="btn primary" data-act="new-ev">Novo evento</button></div>'+
  (up.length?up.map(e=>evCard(e,true)).join(''):'<div class="empty">Ainda não há eventos. Crie o primeiro em «Novo evento».</div>')+
  (past.length?'<h3 style="margin-top:18px;font-size:.95rem" class="muted">Passados</h3>'+past.map(e=>evCard(e,true)).join(''):'')+'</section>'+
  '<div class="stack">'+calendar()+'<div class="note"><b>Envios automáticos:</b> convite quando cria o evento; lembretes 7 dias e 1 dia antes (todos os dias às 9h); aviso quando edita (se escolher) ou cancela.</div></div></div>';
}
function adminSubs(){
  const S=A.inscritos;const conf=S.filter(s=>s.estado==='confirmado').length;
  const rows=S.map(s=>{const pr=ui.pending==='rm-'+s.email;
    return '<tr><td>'+esc(s.nome||'—')+(s.n_ordem?' <span class="pill mem">nº '+esc(s.n_ordem)+'</span>':'')+'</td><td>'+esc(s.email)+'</td><td class="nw">'+esc(s.telemovel||'—')+'</td><td>'+esc(s.localidade||'—')+'</td><td class="notecell">'+esc(s.nota||'—')+'</td><td>'+(s.estado==='confirmado'?'<span class="pill ok">Confirmado</span>':'<span class="pill warn">Pendente</span>')+'</td>'+

    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=c}

async function lerFicheiro(file){
  let rows;

  else{let t=await file.text();if(t.includes('\ufffd')){t=new TextDecoder('windows-1252').decode(await file.arrayBuffer())}rows=parseCSV(t).map(r=>r.map(v=>v.trim()))}
  rows=rows.filter(r=>r.some(v=>v!==''));

  let hi=-1,map=null;for(let i=0;i<Math.min(10,rows.length);i++){const m=mapear(rows[i]);if(m.includes('nome')&&(m.includes('n_ordem')||m.includes('email'))){hi=i;map=m;break}}
  if(hi<0)throw new Error('Não encontrámos as colunas «Nome» e «Nº da Ordem» (ou «Email») no ficheiro. Use o modelo («Descarregar modelo»).');
  const linhas=rows.slice(hi+1).map((r,i)=>{const d={};map.forEach((k,j)=>{if(k&&r[j]!==undefined&&d[k]===undefined)d[k]=r[j]});return {linha:hi+i+2,dados:d}});
  return {linhas,colunas:map.filter(Boolean).map(k=>(MCAMPOS.find(c=>c[0]===k)||[k,k])[1]),ignoradas:rows[hi].filter((h,j)=>!map[j]&&String(h).trim())};
}

  '<details'+(x.titulo_en||x.descricao_en?' open':'')+'><summary style="cursor:pointer;font-weight:600">English version (opcional)</summary><div class="stack" style="margin-top:10px"><label>Título (EN)<input type="text" id="ed-title-en" value="'+esc(x.titulo_en||'')+'"></label><label>Descrição (EN)<textarea id="ed-desc-en">'+esc(x.descricao_en||'')+'</textarea></label><label>Outras atividades (EN, uma por linha, pela mesma ordem)<textarea id="ed-acts-en">'+esc((x.atividades_en||[]).join('\n'))+'</textarea></label><span class="small muted">Se ficar vazio, quem escolher inglês vê o texto em português.</span></div></details>'+
  '<label class="reg-only">Link do álbum de fotos no Google Fotos (opcional)<input type="url" id="ed-album" placeholder="https://photos.app.goo.gl/…" value="'+esc(x.album||'')+'"><span class="small muted" style="font-weight:400">No dia seguinte ao evento, os participantes recebem um agradecimento com este link para partilharem as fotos. Se ficar vazio, a app cria sozinha uma pasta no Google Drive da Comenda e envia esse link.</span></label>'+
  '<label class="reg-only">Outras atividades (uma por linha, opcional)<textarea id="ed-acts" placeholder="Ex.: Visita guiada (10:00)">'+esc(x.atividades.join('\n'))+'</textarea></label>'+
  (e?'<label class="inline reg-only"><input type="checkbox" id="ed-notify" checked> Avisar os convidados da alteração por email</label>':'<div class="note small reg-only">Ao guardar, é enviado um convite com o formulário a todos os inscritos confirmados que podem ver o evento.</div>')+
  (e?'<button class="btn primary">'+(e.estado==='rascunho'?'Guardar rascunho':'Guardar alterações')+'</button>':'<div class="row"><button class="btn primary" data-v="pub">Criar e enviar convites</button><button class="btn" data-v="draft">Guardar como rascunho</button></div>')+'</form>';
}

/* ---------- eventos ---------- */
document.addEventListener('click',async ev_=>{
  const t=ev_.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,email=t.dataset.email,v=t.dataset.v;
  if(a==='modal-bg'&&ev_.target!==t)return;
  let r;
  switch(a){
    case 'month': if(v==='0')ui.month=TODAY().slice(0,7);else{const [y,m]=ui.month.split('-').map(Number);const d=new Date(y,m-1+Number(v),1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1)}break;
    case 'open-ev': ui.modal={type:'event',id};break;
    case 'open-reg': ui.pending=null;ui.modal={type:'reg',id};break;
    case 'open-regpub': ui.pending=null;ui.modal={type:'regpub',id};break;
    case 'lang': LANG=v==='en'?'en':'pt';lsS(LK,LANG);if(D&&D.me&&B.token)call('apiLingua',B.token,LANG).catch(()=>{});break;
    case 'forget': ev_.preventDefault();lsS(TK,'');location.href=B.url;return;
    case 'modal-close': case 'modal-bg': ui.modal=null;ui.pending=null;break;
    case 'tab': ui.tab=v;ui.pending=null;break;
    case 'new-ev': ui.modal={type:'editor',id:null};break;
    case 'edit-ev': ui.modal={type:'editor',id};break;
    case 'regs': ui.modal=null;ui.tab='inscricoes';ui.regEv=id;break;
    case 'notice': ui.modal={type:'notice',id};break;
    case 'ask-cancel': ui.pending='cx-'+id;break;
    case 'ask-rm': ui.pending='rm-'+email;break;
    case 'ask-unreg': {const mv=document.getElementById('r-motivo');if(mv&&!mv.value.trim()){toast(L('Indique primeiro o motivo da anulação.','Please give the reason for cancelling first.'));mv.focus();return}t.outerHTML='<button type="button" class="btn danger" data-act="unreg" data-id="'+(ui.modal&&ui.modal.id)+'">'+L('Confirmar anulação','Confirm cancellation')+'</button>';return}
    case 'pending-clear': ui.pending=null;break;
    case 'add-guest': {const e=ev(id);const g=readGuests();g.push({nome:'',email:'',telemovel:'',agape:false,visita:false,restricoes:'',atividades:[]});document.getElementById('guests').innerHTML=guestsHtml(e,g);const ins=document.querySelectorAll('#guests [data-g=nome]');ins[ins.length-1].focus();return}
    case 'rm-guest': {const e=ev(id);const g=readGuests();g.splice(+v,1);document.getElementById('guests').innerHTML=guestsHtml(e,g);return}
    case 'pw-toggle': {const i=document.getElementById(v);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';t.textContent=show?'Ocultar':'Mostrar';t.setAttribute('aria-pressed',String(show));t.setAttribute('aria-label',show?'Ocultar palavra-passe':'Mostrar palavra-passe');i.focus();return}
    case 'copy-link': {const l=evLink(id);const ok=()=>toast('Link copiado. Pode colá-lo num email ou mensagem.');
      const fb=()=>{const i=document.getElementById('ev-link');if(i){i.focus();i.select();try{document.execCommand('copy')?ok():toast('Selecione o link e copie-o.')}catch(err){toast('Selecione o link e copie-o.')}}else{ui.modal={type:'link',id};renderLayer()}};
      try{navigator.clipboard.writeText(l).then(ok,fb)}catch(err){fb()}return}
    case 'cal': ev_.preventDefault();ui.modal={type:'cal'};break;
    case 'copy-cal': {const i=document.getElementById('cal-url');const ok=()=>toast(L('Endereço copiado.','Address copied.'));try{navigator.clipboard.writeText(i.value).then(ok,()=>{i.select();document.execCommand('copy');ok()})}catch(err){i.select();document.execCommand('copy');ok()}return}
    case 'ics-ev': {const e=ev(id);baixar('evento.ics',icsEvento(e),'text/calendar;charset=utf-8');return}
    case 'pub-ev': r=await act('apiAdminPublicar',B.admin,id);if(r){toast(r);await loadAdmin()}break;
    case 'hide-ev': r=await act('apiAdminOcultar',B.admin,id);if(r){toast(r);await loadAdmin()}break;
    case 'ask-del': ui.pending='del-'+id;break;
    case 'del-ev': r=await act('apiAdminEliminar',B.admin,id);if(r){toast(r);ui.pending=null;await loadAdmin()}break;
    case 'new-mem': ui.modal={type:'membro',v:''};break;
    case 'edit-mem': ui.modal={type:'membro',v};break;
    case 'ask-rm-mem': ui.pending='rmm-'+v;break;
    case 'rm-mem': r=await act('apiAdminRemoverMembro',B.admin,v);if(r){toast(r);ui.pending=null;await loadAdmin()}break;
    case 'ask-notif-all': ui.pending='notif-all';break;
    case 'notif-all': r=await act('apiAdminNotificar',B.admin,'todos',true);if(r){toast(r);ui.pending=null;await loadAdmin()}break;
    case 'import-mem': {const i=document.getElementById('mem-file');i.value='';i.click();return}
    case 'tpl-mem': baixar('modelo_membros.csv',MCAMPOS.map(c=>c[1]).join(';')+'\n1234;João Exemplo Silva;joao@exemplo.pt;912345678;Braga;Cavaleiro;15/03/2020;123456789;;Não;Membro\n;Maria Convidada Costa;maria@exemplo.pt;913000000;Porto;;;;;Não;Convidado\n','text/csv;charset=utf-8');return;
    case 'exp-mem': exportarMembros().catch(err=>toast(errMsg(err)));return;
    case 'do-import': {const I=ui.modal.data,S=new Set(ui.modal.sel);r=await act('apiAdminImportarMembros',B.admin,I.linhas.filter(l=>S.has(l.linha)));if(r){await loadAdmin();ui.modal={type:'import-res',res:r};render()}return}
    case 'forgot': ev_.preventDefault();ui.forgot=v==='1';ui.msg=null;break;
    case 'logout': await act('apiAdminSair',B.admin);sSet('');B.admin='';A=null;ui.msg='Sessão terminada.';break;
    case 'sair': r=await act('apiSair',B.token);if(r){ui.msg=r;D&&(D.me=null)}break;
    case 'unreg': {const mv=val('r-motivo');if(!mv){toast(L('Indique o motivo da anulação.','Please give the reason for cancelling.'));return}r=await act('apiAnular',B.token,id,mv,LANG);}if(r){toast(r);ui.modal=null;ui.pending=null;await loadPublic()}break;
    case 'remind': r=await act('apiAdminLembrete',B.admin,id,7);if(r){toast(r);await loadAdmin()}break;
    case 'cancel-ev': r=await act('apiAdminCancelar',B.admin,id);if(r){toast(r);ui.pending=null;await loadAdmin()}break;
    case 'resend': r=await act('apiAdminReenviar',B.admin,email);if(r){toast(r);await loadAdmin()}break;
    case 'rm-sub': r=await act('apiAdminRemover',B.admin,email);if(r){toast(r);ui.pending=null;await loadAdmin()}break;
    case 'csv': {const e=ev(ui.regEv);const P=peopleOf(e.id);const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
      const txt=[['Tipo','Nº Ordem','Nome','Email','Telemóvel','NIF','Ágape','Visita','Restrições','Atividades','Notas'].map(q).join('\t')].concat(P.map(p=>[p.type,p.n_ordem,p.nome,p.email,p.telemovel,p.nif,p.agape?'Sim':'Não',p.visita?'Sim':'Não',p.restricoes,p.atividades.join('; '),p.nota].map(q).join('\t'))).join('\n');
      try{navigator.clipboard.writeText(txt).then(()=>toast('Tabela copiada. Cole numa folha de cálculo.'),()=>toast('Não foi possível copiar. Use «Abrir folha Google».'))}catch(err){toast('Não foi possível copiar. Use «Abrir folha Google».')}return}
    default: return;
  }
  render();
});
document.addEventListener('input',e_=>{if(e_.target.dataset.input==='mem-q'){ui.q=e_.target.value;const b=document.getElementById('mem-body');if(b)b.innerHTML=memberRows()}});
document.addEventListener('change',async e_=>{
  const t=e_.target,c=t.dataset.change;if(!c)return;
  if(c==='regev'){ui.regEv=t.value;render()}
  if(c==='mem-file'){const file=t.files&&t.files[0];if(!file)return;try{const I=await lerFicheiro(file);if(!I.linhas.length)throw new Error('O ficheiro não tem linhas com dados por baixo do cabeçalho.');const P=await act('apiAdminPreverImportacao',B.admin,I.linhas);if(!P)return;ui.modal={type:'import',data:I,file:file.name,prev:P,sel:P.plano.filter(x=>x.acao==='novo'||x.acao==='atualizar'||x.acao==='repetida').map(x=>x.linha)};renderLayer()}catch(err){toast(errMsg(err))}}
  if(c==='imp-sel'){const M=ui.modal;if(!M||M.type!=='import')return;const n=+t.dataset.v;M.sel=t.checked?[...new Set([...M.sel,n])]:M.sel.filter(x=>x!==n);const b=document.getElementById('imp-go');if(b){b.textContent='Confirmar importação ('+M.sel.length+')';b.disabled=!M.sel.length}return}
  if(c==='ed-ext'){const f=t.closest('form');if(f)f.classList.toggle('ext',t.checked);return}
  if(c==='notif'){const on=t.checked;t.disabled=true;const r=await act('apiAdminNotificar',B.admin,[t.dataset.k],on);if(r){toast(r);await loadAdmin();render()}else{t.checked=!on;t.disabled=false}return}
  if(c==='adm'){const on=t.checked;const r=await act('apiAdminTornarAdmin',B.admin,t.dataset.email,on);if(r){toast(r);await loadAdmin();const b=document.getElementById('mem-body');if(b)b.innerHTML=memberRows()}else t.checked=!on;return}
  if(c==='member'){const r=await act('apiAdminMembro',B.admin,t.dataset.email,t.checked);if(r){toast(r);const s=A.inscritos.find(x=>x.email===t.dataset.email);if(s)s.membro=t.checked}else t.checked=!t.checked}
});
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
document.addEventListener('submit',async e_=>{
  e_.preventDefault();const f=e_.target,k=f.dataset.form;let r;
  if(k==='subscribe'){r=await act('apiSubscrever',{email:val('sub-email'),nome:val('sub-name'),telemovel:val('sub-phone'),localidade:val('sub-city'),nota:val('sub-note'),n_ordem:val('sub-num'),lang:LANG});
    if(r){f.outerHTML='<div class="note ok-note">'+esc(r)+'</div>'}return}
  if(k==='admin-login'){r=await act('apiAdminLogin',val('adm-email'),document.getElementById('adm-pw').value);if(r){sSet(r);B.admin=r;ui.msg=null;await loadAdmin();render()}return}
  if(k==='admin-forgot'){r=await act('apiAdminPedirPassword',val('adm-email'));if(r){ui.msg=r;ui.forgot=false;render()}return}
  if(k==='definir'){const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;if(p1!==p2){toast('As duas palavras-passe não são iguais.');return}
    r=await act('apiAdminDefinirPassword',B.reset,p1);if(r){sSet(r.sessao);B.admin=r.sessao;ui.mode='admin';ui.msg=null;toast('Palavra-passe guardada.');await loadAdmin();render()}return}
  if(k==='regpub'||k==='reg'){const e=ev(f.dataset.id);
    const data={nome:val('r-name'),telemovel:val('r-phone'),agape:((f.querySelector('[name=r-agape]:checked')||{}).value==='1'),visita:((f.querySelector('[name=r-visita]:checked')||{}).value==='1'),nif:val('r-nif'),restricoes:val('r-diet'),observacoes:val('r-notes'),motivo:val('r-motivo'),atividades:[...f.querySelectorAll('[name=r-act]:checked')].map(i=>i.value),convidados:e.campos.convidados?readGuests():[]};
    if(k==='regpub'){const pp={email:val('p-email'),nome:val('r-name'),telemovel:val('p-tel'),localidade:val('p-loc'),n_ordem:val('p-num')};data.telemovel=pp.telemovel;r=await act('apiInscreverPublico',e.id,pp,data,LANG);if(r){ui.modal={type:'msg',title:L('Confirme o seu email','Check your email'),text:r};renderLayer()}return}
    data.lang=LANG;r=await act('apiInscrever',B.token,e.id,data);if(r){toast(r);ui.modal=null;await loadPublic();render()}return}
  if(k==='editor'){const campos={};f.querySelectorAll('[name=ed-f]').forEach(i=>campos[i.value]=i.checked);
    const d={id:f.dataset.id||'',titulo:val('ed-title'),data:val('ed-date'),hora:val('ed-time'),hora_fim:val('ed-end'),album:val('ed-album'),titulo_en:val('ed-title-en'),descricao_en:val('ed-desc-en'),atividades_en:val('ed-acts-en').split('\n').map(x=>x.trim()),local:val('ed-loc'),descricao:val('ed-desc'),visibilidade:val('ed-vis'),prazo:val('ed-dl'),lotacao:val('ed-cap'),campos,atividades:val('ed-acts').split('\n').map(x=>x.trim()).filter(Boolean)};
    d.ext=document.getElementById('ed-ext').checked;
    if(d.ext){d.externo=val('ed-ext-nome');d.externo_link=val('ed-ext-link');d.prazo=d.data;if(!d.externo){toast('Indique o nome da comenda que organiza o evento.');return}}
    else if(!d.prazo){toast('Indique a data-limite das inscrições.');return}
    if(d.prazo>d.data){toast('O prazo de inscrição tem de ser antes ou no dia do evento.');return}
    if(d.hora_fim&&d.hora_fim<=d.hora){toast('A hora de fim tem de ser depois da hora de início.');return}
    const n=document.getElementById('ed-notify');
    d.rascunho=!!(e_.submitter&&e_.submitter.dataset.v==='draft');
    r=await act('apiAdminGuardarEvento',B.admin,d,!!(n&&n.checked));if(r){ui.month=d.data.slice(0,7);await loadAdmin();if(r.novo&&!r.rascunho){ui.modal={type:'link',id:r.id,msg:r.msg,novo:true}}else{ui.modal=null;toast(r.msg||r)}render()}return}
  if(k==='notice'){const to=(f.querySelector('[name=n-to]:checked')||{}).value;r=await act('apiAdminNovidade',B.admin,f.dataset.id,val('n-subj'),val('n-body'),to==='reg');if(r){toast(r);ui.modal=null;await loadAdmin();render()}return}
  if(k==='membro'){const m={};MCAMPOS.forEach(c=>m[c[0]]=val('m-'+c[0]));m.direcao=document.getElementById('m-direcao').checked?'SIM':'';r=await act('apiAdminGuardarMembro',B.admin,m,f.dataset.v||'');if(r){toast(r);ui.modal=null;await loadAdmin();render()}return}
  if(k==='admin-add'){r=await act('apiAdminConvidar',B.admin,val('add-name'),val('add-email'),document.getElementById('add-member').checked);if(r){toast(r);await loadAdmin();render()}return}
  if(k==='settings'){r=await act('apiAdminDefinicoes',B.admin,val('set-org'),val('set-admins'));if(r){toast(r);await loadAdmin();if(A)document.getElementById('orgname').textContent=A.org;render()}return}
});
document.addEventListener('keydown',e_=>{if(e_.key==='Escape'&&ui.modal){ui.modal=null;renderLayer()}});
boot();
})();

</script></body></html>
